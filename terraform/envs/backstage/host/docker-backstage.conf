# /etc/systemd/system/docker.service.d/backstage.conf
# Docker never runs without the data volume mounted and the Portal firewall in place; the
# firewall is re-applied after dockerd starts in case dockerd changed DOCKER-USER. The stop
# timeout covers the app's 90 s grace period and daemon.json's shutdown-timeout.
[Unit]
Requires=backstage-data.service backstage-firewall.service
After=backstage-data.service backstage-firewall.service
RequiresMountsFor=/srv/backstage

[Service]
ExecStartPost=/usr/local/sbin/backstage-firewall
TimeoutStopSec=150
