name: Terraform Plan

# Plans the staging root on pull requests with the read-only role
# arclight-overcast-terraform-plan-staging (DR-1b). The role writes nothing, so the plan runs
# with -lock=false. The repository is public: only the plan summary and the list of
# action/address pairs (never attribute values) are printed or posted, plus Terraform's Error
# lines on failure; run the detailed plan locally. Never set TF_LOG and never upload the plan.
# scripts/plan_guard.py fails the job if the plan would weaken CloudTrail protection (D-075).
# Inputs CI cannot read from the gitignored terraform.tfvars come from repository settings:
# variable CORE_IMAGE_TAG (update after each Core deploy) and secret ALARM_EMAIL.

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '!terraform/corporate/**'
      - '!terraform/envs/backstage/**'
      - 'services/**/*.tpl'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging]
    env:
      TF_VAR_core_image_tag: ${{ vars.CORE_IMAGE_TAG }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.6'
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::650880817826:role/arclight-overcast-terraform-plan-${{ matrix.environment }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform init -input=false -no-color > init-output.txt 2>&1 || { grep -E '^(Error|│ Error)' init-output.txt; exit 1; }

      - name: Terraform Validate
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: terraform/envs/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -out=plan.tfplan > plan-output.txt 2>&1
          code=$?
          { grep -E '^(Plan:|No changes)' plan-output.txt || true; } > plan-summary.txt
          if [ "$code" -eq 0 ]; then
            terraform show -json plan.tfplan > plan.json
            # Action/address pairs only; never attribute values.
            jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/")) \(.address)"' \
              plan.json >> plan-summary.txt
            # D-075 / O-015: refuse plans that weaken CloudTrail log protection.
            python3 "$GITHUB_WORKSPACE/scripts/plan_guard.py" plan.json >> plan-summary.txt || code=3
            rm -f plan.json
          else
            grep -E '^(Error|│ Error)' plan-output.txt >> plan-summary.txt || echo "Plan failed (exit $code); run it locally for details." >> plan-summary.txt
          fi
          echo "plan_exit_code=$code" >> "$GITHUB_OUTPUT"
          cat plan-summary.txt
          rm -f plan-output.txt plan.tfplan

      - name: Post plan summary to PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/envs/${{ matrix.environment }}/plan-summary.txt';
            const summary = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const body = `### Terraform Plan — ${{ matrix.environment }}

            \`\`\`
            ${summary || 'No plan summary was produced.'}
            \`\`\`

            Summary only (public repository); run the detailed plan locally.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on plan error
        if: always() && steps.plan.outputs.plan_exit_code != '0'
        run: |
          echo "terraform plan exited '${{ steps.plan.outputs.plan_exit_code }}'"
          exit 1
