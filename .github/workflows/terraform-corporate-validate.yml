name: Terraform Corporate Validate

on:
  pull_request:
    paths:
      - 'terraform/corporate/**'
      - '.github/workflows/terraform-corporate-validate.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/corporate/**'
      - '.github/workflows/terraform-corporate-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root:
          - terraform/corporate/entra/bootstrap
          - terraform/corporate/state
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.6'

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init Without Backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate

      - name: Entra Boundary Tests
        if: matrix.root == 'terraform/corporate/entra/bootstrap'
        run: terraform test
