name: Terraform Corporate Validate

on:
  pull_request:
    paths:
      - 'terraform/corporate/**'
      - '.github/workflows/terraform-corporate-validate.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/corporate/**'
      - '.github/workflows/terraform-corporate-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root:
          - terraform/corporate/entra/bootstrap
          - terraform/corporate/entra/applications
          - terraform/corporate/state
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.6'

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: No credential resources in corporate roots
        run: '! grep -rEn "azuread_application_password|azuread_service_principal_password|tls_private_key|random_password" --include=*.tf .'

      - name: Terraform Init Without Backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate

      - name: Entra Boundary Tests
        if: startsWith(matrix.root, 'terraform/corporate/entra/')
        run: terraform test
