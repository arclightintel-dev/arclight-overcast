name: Deploy Backstage
# Manual only (Overcast never deploys on merge). Runs backstage-deploy on the Backstage host
# over SSM Run Command for one Backstage commit whose images and deploy bundle CI already
# published (s3://arclight-backstage-prod-deploy/<sha>/ with images.json). Rollback = run
# this again with the previous commit. Runbook: docs/runbooks/deploy-backstage.md.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Backstage commit (full 40-character SHA)'
        required: true
        type: string
      mode:
        description: 'normal; accept-recovery-required (cutover or DR); stage-only (pull and select, start nothing: smoke deploy and cutover)'
        required: true
        type: choice
        default: normal
        options:
          - normal
          - accept-recovery-required
          - stage-only

concurrency:
  group: deploy-backstage
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::650880817826:role/arclight-backstage-prod-deploy
  DEPLOY_BUCKET: arclight-backstage-prod-deploy
  HOST_NAME_TAG: arclight-backstage-prod-host

jobs:
  deploy:
    name: Deploy ${{ inputs.sha }}
    runs-on: ubuntu-latest
    # The deploy role trusts only this GitHub environment, which is restricted to main.
    environment: backstage
    timeout-minutes: 60
    env:
      SHA: ${{ inputs.sha }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character lowercase SHA"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the bundle and its images
        run: |
          aws s3 cp "s3://$DEPLOY_BUCKET/$SHA/images.json" images.json --only-show-errors
          for pair in app:arclight/backstage portal:arclight/backstage-portal litestream:arclight/litestream; do
            key="${pair%%:*}"; repo="${pair#*:}"
            digest=$(python3 -c 'import json, sys; print(str(json.load(open("images.json"))[sys.argv[1]]).rsplit("sha256:", 1)[-1])' "$key")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::images.json: $key is not a sha256 digest"; exit 1; }
            aws ecr describe-images --repository-name "$repo" --image-ids "imageDigest=sha256:$digest" \
              --query 'imageDetails[0].imageTags' --output text
          done

      - name: Wake the host if it is stopped
        id: host
        run: |
          iid=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$HOST_NAME_TAG" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$iid" ] && [ "$(wc -w <<<"$iid")" -eq 1 ] || { echo "::error::expected exactly one host, found: '$iid'"; exit 1; }
          echo "id=$iid" >>"$GITHUB_OUTPUT"
          state=$(aws ec2 describe-instances --instance-ids "$iid" --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "host $iid is $state"
          if [ "$state" = stopping ]; then aws ec2 wait instance-stopped --instance-ids "$iid"; state=stopped; fi
          if [ "$state" = stopped ]; then
            aws ec2 start-instances --instance-ids "$iid" >/dev/null
            aws ec2 wait instance-running --instance-ids "$iid"
          fi
          for _ in $(seq 1 60); do
            ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$iid" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$ping" = Online ] && { echo "SSM agent online"; exit 0; }
            sleep 10
          done
          echo "::error::SSM agent did not come online within 10 minutes"; exit 1

      - name: Deploy over SSM Run Command
        env:
          IID: ${{ steps.host.outputs.id }}
        run: |
          case "$MODE" in
            normal) extra="" ;;
            accept-recovery-required) extra=" --accept-recovery-required" ;;
            stage-only) extra=" --stage-only" ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          cmd=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "backstage-deploy $SHA" --timeout-seconds 3600 \
            --parameters "commands=[\"/usr/local/sbin/backstage-deploy $SHA$extra\"],executionTimeout=[\"3300\"]" \
            --query Command.CommandId --output text)
          echo "command $cmd"
          # Own polling loop: the CLI waiter gives up long before a 15-minute readiness wait.
          while :; do
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$IID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backstage deploy"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Host | \`${{ steps.host.outputs.id }}\` |"
            echo "| Mode | $MODE |"
            echo "| Result | ${{ job.status }} |"
          } >>"$GITHUB_STEP_SUMMARY"
